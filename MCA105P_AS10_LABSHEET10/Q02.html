/* Full Question: Create an HTML medicine entry form that accepts Medicine ID, Medicine Name, Category, Price, Stock, and Manufacturer. Add a suitable Submit button. */

<!doctype html><html><head><title>Medicine Entry</title><link rel='stylesheet' href='/static/style.css'></head><body><h1>Medicine Entry</h1><form method='post' action='/add'><label>Medicine ID</label><input name='medicine_id' type='number' required><label>Medicine Name</label><input name='name' required><label>Category</label><input name='category' required><label>Price</label><input name='price' type='number' step='0.01' required><label>Stock</label><input name='stock' type='number' required><label>Manufacturer</label><input name='manufacturer' required><button>Submit</button></form></body></html>
