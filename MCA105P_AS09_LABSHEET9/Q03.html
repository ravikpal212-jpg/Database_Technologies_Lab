/* Full Question: Create an HTML page containing a student registration form with fields for Student ID, Student Name, Age, Gender, Department, and Marks. Add a suitable Submit button. */

<!doctype html>
<html><head><title>Student Registration</title><link rel='stylesheet' href='/static/style.css'></head><body><h1>Student Registration</h1><form method='post' action='/add'><label>Student ID</label><input name='student_id' type='number' required><label>Student Name</label><input name='name' required><label>Age</label><input name='age' type='number' required><label>Gender</label><input name='gender' required><label>Department</label><input name='department' required><label>Marks</label><input name='marks' type='number' step='0.01' required><button>Submit</button></form></body></html>
